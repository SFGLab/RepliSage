; Full cell cycle with 3D structures (two sister chromatids), viewer and movie.
; Run:  replisage -c examples/replication_3d.ini
[general]
platform = CUDA                   ; CPU | CUDA | OpenCL
device = 0                        ; GPU index

[input]
bedpe_path = loops.bedpe
rept_path = GM12878_repliseq.bigWig
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 300

[replication]
rep_start_time = 20000
rep_time_duration = 20000

[mc]
n_steps = 60000
mc_step = 100                     ; 600 sampled states -> 600 structures
burnin = 2000

[md]
simulation_type = MD              ; MD = one minimisation then dynamics; EM = minimise each state
initial_structure_type = rw
integrator_type = langevin
integrator_step = 100 femtosecond
sim_temp = 310 kelvin
sim_step = 5000                   ; integrator steps per sampled state (default 1000)
ev_p = 0.01                       ; chance that a bead's excluded volume is off

[output]
html_3d = True                    ; interactive viewer
skip_movies = False                ; write the movies (mp4, the default); True skips them
movie_color = auto                ; auto | sister | compartment | rainbow | replication
movie_interp = 5                  ; interpolated frames between structures
