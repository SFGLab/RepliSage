; Loop extrusion only: no replication timing, no 3D structures.
; Run:  replisage -c examples/loops_only.ini
[input]
bedpe_path = loops.bedpe          ; your loops (BEDPE, CTCF orientation optional)
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 400                     ; about 45 kb per bead here

[mc]
n_steps = 100000                  ; Monte Carlo steps
mc_step = 100                     ; record every 100 steps
burnin = 5000                     ; discarded at the start
t_mc = 1.5                        ; temperature: higher = more fluctuations
folding_coeff = 1.0               ; stronger = larger loops
bind_coeff = 1.0                  ; stronger = loops hold on to CTCF sites

[output]
report = True
