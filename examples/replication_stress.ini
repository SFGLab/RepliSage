; Replication stress: slower forks, more origins, noisier timing.
; Same as the flag --with-stress. The three values below are what the flag sets.
[input]
bedpe_path = loops.bedpe
use_sc_rept = True
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 400

[replication]
rep_with_stress = False           ; set True to apply the preset, or set the values yourself:
rep_t_std_factor = 0.2            ; wider origin-firing time distribution (normal 0.1)
rep_speed_scale = 1.0             ; slower forks (normal 10)
rep_init_rate_scale = 2.0         ; twice as many origin firings (normal 1.0)
rep_start_time = 40000
rep_time_duration = 40000

[mc]
n_steps = 120000
burnin = 4000
