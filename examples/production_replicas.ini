; Long run with several independent replicas and all outputs.
; Run:  replisage -c examples/production_replicas.ini -v
[general]
n_threads = 4                     ; replicas run in parallel
seed = 1                          ; reproducible runs
out_path = results

[input]
bedpe_path = loops.bedpe
rept_path = GM12878_repliseq.bigWig
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 800

[replication]
rep_start_time = 100000
rep_time_duration = 100000

[mc]
n_steps = 400000
mc_step = 200
burnin = 10000
n_replicas = 4

[md]
simulation_type = MD
platform = CUDA

[output]
fig_dpi = 200
