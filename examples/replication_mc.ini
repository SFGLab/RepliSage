; Replication + epigenetic compartments, Monte Carlo only (fast, no OpenMM).
; Run:  replisage -c examples/replication_mc.ini
[input]
bedpe_path = loops.bedpe
rept_path =                       ; empty + use_sc_rept = built-in single-cell timing
use_sc_rept = True                ; or set rept_path to a .bigWig / .txt / .parquet
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 400

[replication]
rep_sim_t = 1000                  ; time points of the replication simulation
rep_start_time = 40000            ; S phase starts at this MC step ...
rep_time_duration = 40000         ; ... and lasts this many steps
rep_with_stress = False

[mc]
n_steps = 120000
mc_step = 100
burnin = 4000                     ; must end before S phase starts
epi_field_coeff = 1.0             ; how strongly timing biases A/B
epi_interact_coeff = 1.0          ; how strongly loops couple A/B states
rep_coeff = 0.01                  ; replication barrier (x 1e8)
rep_fork_push = True              ; forks push loops

[md]
simulation_type =                 ; empty = no 3D
