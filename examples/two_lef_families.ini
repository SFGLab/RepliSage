; Two kinds of extruders, for example cohesin (family 1) and condensin (family 2).
[input]
bedpe_path = loops.bedpe
chrom = chr14
region_start = 80835000
region_end = 98674700
n_beads = 400

[mc]
n_lef = 60                        ; family 1
n_lef2 = 20                       ; family 2
folding_coeff = 1.0
folding_coeff2 = 2.0              ; family 2 makes larger loops
cohesin_blocks_condensin = False  ; True: the two families also avoid crossing each other
n_steps = 100000
burnin = 5000
