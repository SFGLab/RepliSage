; RepliSage template: EVERY parameter (command-line flags are shortcuts for a few of them). Run: replisage -c this.ini - generated 2026-11-03T09:33:03

;  Priority: defaults < this file < command-line flags. Empty value = not set / default.
;  Minimal useful file: bedpe_path, chrom (+ region_start/end), rept_path (file | builtin | none).

[general]   ; run, hardware
; OpenMM platform: auto (default) tries CUDA, then OpenCL, then CPU and falls back on any error; or force CUDA, OpenCL or CPU.
platform = auto
; Device index for CUDA or OpenCL (count from 0).
device = 
; Root folder of results. Each run gets its own sub-folder inside.
out_path = results
; [new] Exact name of the run sub-folder. Empty = automatic name (chrom + region + time).
run_name = 
; [new] Free label appended to the automatic run name.
run_tag = 
; [new] Number of CPU threads used to run independent MC replicas in parallel.
n_threads = 1
; [new] Random seed of the Monte Carlo (empty = random).
seed = 
; [new] Verbosity 0-3 (same as -v, -vv, -vvv): 0 stages, progress bars and results; 1 + input / output tables; 2 + detailed info; 3 everything.
verbose = 0

[input]   ; data and region
; A .bedpe file path with loops (CTCF anchors). It is required: without it the model does not know where the CTCF barriers are. Optional columns 8-9 hold CTCF orientation. [REQUIRED]
bedpe_path = 
; The replication timing dataset (.txt, .bw, .bigwig). If empty, no replication is modelled (unless USE_SC_REPT). [file (.bigWig/.txt/.parquet) | builtin | none]
rept_path = 
; The single cell replication timing dataset (.parquet).
sc_rept_path = /tmp/rs/RepliSage/src/data/replication_timing_data.parquet
; [new] Use the built-in single-cell replication timing when REPT_PATH is empty.
use_sc_rept = False
; [new] Ask interactively what to do when no replication timing is given (only in a terminal).
ask_rt = True
; Chromosome of the modelling region of interest. [REQUIRED]
chrom = 
; Starting region coordinate. Empty = whole chromosome.
region_start = 
; Ending region coordinate. Empty = whole chromosome.
region_end = 
; Number of Simulation Beads. Empty = region length / 7 kb (about 10 beads per CTCF site; max 10,000 beads).
n_beads = 

[preprocessing]   ; replication-timing preprocessing
; [new] Number of time points of the replication simulation.
rep_sim_t = 1000
; [new] Bin size (bp) used to average a Repli-Seq bigWig.
bigwig_bin_size = 1000
; [new] Gaussian smoothing (in bins) of a Repli-Seq bigWig.
bigwig_sigma = 200.0
; [deprecated] Repli-Seq signals are always log-normalised; this value is ignored.
bigwig_log_norm = True

[replication]   ; replication
; True sets REP_T_STD_FACTOR, REP_SPEED_SCALE and REP_INIT_RATE_SCALE to replication-stress values.
rep_with_stress = False
; Factor multiplying the standard deviation of the replication timing curve.
rep_t_std_factor = 0.1
; A scale that quantifies the speed of the replication forks.
rep_speed_scale = 10
; Multiplier of the experimentally estimated initiation rate.
rep_init_rate_scale = 1.0
; MC step at which replication starts (G1 = the steps before it).
rep_start_time = 50000
; Duration of replication (in MC steps); G2/M = the steps after S phase.
rep_time_duration = 50000

[mc]   ; Monte Carlo and loop extrusion
; Random walk for cohesins instead of unidirectional sliding.
lef_rw = True
; Allow cohesins to block condensins during simulation.
cohesin_blocks_condensin = False
; Use a random initial distribution of epigenetic states.
random_init_spins = True
; Probability of proposing a rewiring move (LEF move).
p_rew = 0.5
; Hard-coded replication fork pushing in the MC moves.
rep_fork_push = True
; Model replication forks as epigenetic organizers.
rep_fork_epigenetic_organizer = True
; [new] LEFs load preferentially where loops span (CTCF occupancy), and rarely in loop-naked areas. Also --preferential-binding.
preferential_binding = False
; [new] Loading weight of loop-naked beads relative to the most occupied bead (0-1) when PREFERENTIAL_BINDING is on.
pref_bind_floor = 0.05
; [new] Exponent applied to the occupancy before loading (1 = proportional, >1 = stronger preference).
pref_bind_power = 1.0
; Total number of Monte Carlo steps (default: G1 50000 + S 50000 + G2/M 50000).
n_steps = 150000
; Number of node or link state changes proposed per simulation step.
n_sweep = 1000
; Number of loop extrusion factors (LEFs). Empty = half the number of CTCF sites (changed from twice in earlier versions).
n_lef = 
; Number of second-family LEFs (different speed).
n_lef2 = 0
; Sampling frequency of MC steps (avoids autocorrelation).
mc_step = 200
; Burn-in period (steps before equilibrium).
burnin = 5000
; Temperature of the stochastic MCMC model.
t_mc = 1.5
; Folding coefficient for the first family of LEFs.
folding_coeff = 1.0
; Folding coefficient for the second family of LEFs.
folding_coeff2 = 0.0
; Replication-barrier penalty (energy scale = coeff * 1e8; was 1.0 = 1e8 in the published v1.0).
rep_coeff = 0.01
; Interaction coefficient of the epigenetic state model.
epi_interact_coeff = 1.0
; Field coefficient of the epigenetic state model.
epi_field_coeff = 1.0
; Coefficient for LEF crossing.
cross_coeff = 1.0
; Coefficient for CTCF binding.
bind_coeff = 1.0
; [new] Independent MC chains; each is processed into its own replica_XX sub-folder.
n_replicas = 1

[md]   ; 3D structure (OpenMM)
; rw, confined_rw, self_avoiding_rw, helix, circle, spiral, sphere, hilbert.
initial_structure_type = rw
; 3D engine: MD (one minimization + dynamics, the default: gives the replication trajectory) or EM (many minimizations). none/empty = stop after the Monte Carlo.
simulation_type = MD
; Save a .dcd video of the 3D structure.
dcd_reporter = False
; langevin or brownian.
integrator_type = langevin
; Integrator time step (e.g. '100 femtosecond').
integrator_step = 100 femtosecond
; Path to XML file with the forcefield.
forcefield_path = /tmp/rs/RepliSage/src/forcefields/classic_sm_ff.xml
; Probability that excluded volume of a bead is randomly disabled.
ev_p = 0.01
; Stopping tolerance of the energy minimization.
tolerance = 1.0
; Temperature of the 3D simulation (e.g. '310 kelvin').
sim_temp = 310 kelvin
; MD steps performed each time the loop forces change.
sim_step = 1000

[output]   ; report and figures
; Save diagnostic plots.
save_plots = True
; Save metadata of the stochastic simulation.
save_mdt = True
; [new] Write report.html (model summary, figures, tables, command and all parameters).
report = True
; [new] Write an interactive 3D viewer (viewer_3d.html) of the ensemble.
html_3d = True
; [new] Skip the PyVista movies (mp4) of the ensemble. By default the movies are written (they take time: use --skip-movies to disable).
skip_movies = False
; [new] Movie colouring: auto (sister + compartment movies), sister, compartment, rainbow or replication.
movie_color = auto
; [new] Colour map of the contact map in the movie and the viewer: turbo (most variable), inferno, magma, viridis, cividis or rs.
movie_cmap = turbo
; [new] Interpolated frames between two structures in the movie.
movie_interp = 5
; [new] Resolution (dpi) of the saved figures and of the report.
fig_dpi = 200
; Save the averaged heatmaps of the 3D ensemble.
viz_heats = True
