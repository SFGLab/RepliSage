; =====================================================================
;  RepliSage v1.0.0 configuration
;  Priority: defaults  <  this file (-c config.ini)  <  command-line flags (--bedpe-file, --rt-file, ...)
;  This file is the place for ALL detailed parameters (MC, replication, MD, force field, plots).
;  Empty value = "not set". Leave REPT_PATH empty to model only loop extrusion.
; =====================================================================

[general]
platform = CPU               ; CPU | CUDA | OpenCL (MD only)
out_path = results           ; results root; each run gets its own sub-folder
run_name =                   ; exact run folder name (empty = chrom_region_time)
run_tag =                    ; optional label appended to the automatic name
n_threads = 4                ; threads for parallel MC replicas
n_replicas = 1               ; independent MC chains (see [mc])
seed =                       ; random seed (empty = random)
verbose = 0                  ; 0..3, same as -v / -vv / -vvv

[input]
bedpe_path = loops.bedpe          ; CTCF / cohesin loops (required)
rept_path =                       ; replication timing (.bigWig, .txt). Empty = no replication
use_sc_rept = False          ; use the built-in single-cell timing if rept_path is empty
chrom = chr14
region_start = 40535000      ; empty start/end = whole chromosome
region_end = 60174700
n_beads = 1000

[preprocessing]
rep_sim_t = 1000             ; time points of the replication simulation
bigwig_bin_size = 1000
bigwig_sigma = 200.0
bigwig_log_norm = True

[replication]
rep_with_stress = False
rep_start_time = 15000
rep_time_duration = 20000
; rep_t_std_factor = 0.5
; rep_init_rate_scale = 10

[mc]
n_lef = 100
n_lef2 = 100
n_steps = 50000
n_sweep = 1000
mc_step = 200
burnin = 1000
t_mc = 1.8
lef_rw = True
random_init_spins = True
cohesin_blocks_condensin = False
folding_coeff = 1.0
folding_coeff2 = 2.0
epi_interact_coeff = 1.0
epi_field_coeff = 1.0
; replication-barrier penalty = rep_coeff * 1e8 (v1.0 used 1.0 = 1e8; 0.01 = 1e6 blocks LEFs just as well)
rep_coeff = 0.01
rep_fork_epigenetic_organizer = True

[md]
simulation_type =            ; MD | EM | empty (= no 3D structure)
initial_structure_type = rw
tolerance = 1.0
ev_p = 0.01
dcd_reporter = False

[output]
save_plots = True
save_mdt = True
viz_heats = True
; report.html, 3D viewer, movie
report = True
fig_dpi = 200
html_3d = True
movie = True
movie_color = auto
movie_interp = 5
