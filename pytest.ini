[pytest]
testpaths = tests
# short summary of failures; the slow OpenMM tests only run with: pytest -m slow   (or everything: pytest -m "")
addopts = -ra --tb=short -m "not slow" -p no:cacheprovider
markers =
    slow: runs OpenMM / the full pipeline (select with -m slow)
filterwarnings =
    ignore::DeprecationWarning
