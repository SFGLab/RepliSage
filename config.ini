; RepliSage config: a 14 Mb region (chr14:43-57 Mb, 2000 beads, many TADs) of GM12878, local data.
; Run: replisage -c config.ini     Priority: defaults < this file < command line.

[general]
platform = OpenCL
out_path = results
run_name = chr14_43-57Mb_2000beads

[input]
; Local data (GM12878)
bedpe_path = /home/blackpianocat/Data/ENCODE/ChIA-PET/GM12878/ENCSR184YZV_CTCF/LHG0052H_loops_cleaned_th10_2.bedpe
rept_path = /home/blackpianocat/Data/ENCODE/RepliSeq/GM12878/ENCSR000CXJ/ENCFF001GNK.bigWig
chrom = chr14
; 14 Mb window
region_start = 43000000
region_end = 57000000
; 7 kb per bead (the default resolution)
n_beads = 2000

[replication]
rep_with_stress = False
; G1 = 50k steps, S = 50k steps, G2/M = 100k steps (twice S)
rep_start_time = 50000
rep_time_duration = 50000

[mc]
; total = G1 50k + S 50k + G2/M 100k
n_steps = 200000
burnin = 5000
mc_step = 200
n_sweep = 1000
; empty = half the number of CTCF sites
n_lef = 
n_lef2 = 0
lef_rw = True
cohesin_blocks_condensin = False
; compartments: A/B states from the Potts model, driven by RT (field) and neighbours (interaction)
random_init_spins = True
rep_fork_epigenetic_organizer = True
; one fixed T_mc inside the critical region (no annealing)
t_mc = 1.5
folding_coeff = 1.0
epi_interact_coeff = 1.0
epi_field_coeff = 1.0
rep_coeff = 0.01

[md]
initial_structure_type = rw
simulation_type = MD
dcd_reporter = False
ev_p = 0.01
tolerance = 1.0

[output]
save_plots = True
report = True
html_3d = True
; movies: sister + compartment colouring
skip_movies = False
movie_color = auto
viz_heats = True
